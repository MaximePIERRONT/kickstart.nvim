name: Java multi-module + DAP smoke

on:
  pull_request:
  push:
    branches: [master, cursor/from-upstream-master-c628, cursor/debug-tests-p2-7edb]

jobs:
  maven-multi-module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven verify (domain + api + Micronaut infrastructure)
        working-directory: test-project
        run: mvn -B clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            test-project/*/target/surefire-reports/**
          if-no-files-found: ignore

  maven-tests-nvim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: maven-multi-module
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Neovim
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          sudo ln -sfn /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1

      - name: Warm Maven modules (dependency download)
        working-directory: test-project
        run: mvn -B -DskipTests dependency:go-offline

      - name: Run maven-tests Neovim smoke
        run: |
          nvim --headless -u NONE \
            -c "luafile .github/workflows/test-maven-tests.lua"

  dap-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: maven-multi-module
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq git curl unzip ripgrep build-essential

      - name: Install Neovim
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          sudo ln -sfn /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1

      - name: Point Neovim config at this repo
        run: |
          mkdir -p "$HOME/.config"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.config/nvim"

      - name: Bootstrap plugins + Mason tools
        env:
          JDTLS_JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          set -euo pipefail
          # First launch installs vim.pack plugins and triggers mason-tool-installer.
          timeout 300s nvim --headless "+lua vim.notify('boot')" +qa || true
          nvim --headless \
            "+lua require('mason').setup()" \
            "+lua require('mason-tool-installer').setup({ ensure_installed = { 'jdtls', 'java-debug-adapter', 'js-debug-adapter' }, run_on_start = false })" \
            "+MasonToolsInstallSync" \
            +qa
          echo "PATH_MASON=$HOME/.local/share/nvim/mason/bin" >> "$GITHUB_ENV"
          echo "$HOME/.local/share/nvim/mason/bin" >> "$GITHUB_PATH"

      - name: DAP smoke (jdtls bundles + java adapter)
        env:
          JDTLS_JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          export PATH="$HOME/.local/share/nvim/mason/bin:$PATH"
          which jdtls
          nvim --headless \
            -c "luafile .github/workflows/test-dap-smoke.lua"
