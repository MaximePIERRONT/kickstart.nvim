name: Java CI with Neotest

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

jobs:
  maven-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        working-directory: test-project
        run: mvn clean verify

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-test-results
          path: test-project/core/target/surefire-reports

  neotest-simple:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ripgrep fd-find unzip curl

      - name: Install Neovim
        run: |
          sudo add-apt-repository -y ppa:neovim-ppa/unstable
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Install plugins
        run: |
          nvim --headless "+Lazy! sync" +qa! 2>&1 || true

      - name: Run simple neotest test
        run: |
          nvim --headless \
            -c "set runtimepath+=." \
            -c "luafile .github/workflows/test-neotest-simple.lua" \
            -c "qa!" 2>&1

  neotest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: neotest-simple
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ripgrep fd-find unzip curl

      - name: Install Neovim
        run: |
          sudo add-apt-repository -y ppa:neovim-ppa/unstable
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Install Maven dependencies
        working-directory: test-project
        run: mvn dependency:go-offline -DskipTests

      - name: Download JUnit Platform Console Standalone
        run: |
          mkdir -p ~/.local/share/neotest-java
          curl -sL https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar \
            -o ~/.local/share/neotest-java/junit-platform-console-standalone.jar

      - name: Set environment for neotest-java
        run: |
          echo "NEOTEST_JAVA_CONSOLE_JAR=${HOME}/.local/share/neotest-java/junit-platform-console-standalone.jar" >> $GITHUB_ENV
          echo "JDTLS_JAVA_TOOLS=false" >> $GITHUB_ENV

      - name: Install plugins
        run: |
          nvim --headless "+Lazy! sync" +qa! 2>&1 || true

      - name: Run full neotest test
        run: |
          nvim --headless \
            -c "set runtimepath+=." \
            -c "luafile .github/workflows/test-neotest-full.lua" \
            -c "qa!" 2>&1
