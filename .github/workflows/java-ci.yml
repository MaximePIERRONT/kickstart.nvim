name: Java CI with Neotest

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  maven-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        working-directory: test-project
        run: mvn clean verify

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-project/core/target/surefire-reports

  neotest-validation:
    runs-on: ubuntu-latest
    needs: maven-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Neovim
        run: |
          sudo add-apt-repository -y ppa:neovim-ppa/unstable
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Install Maven dependencies
        working-directory: test-project
        run: mvn dependency:go-offline -DskipTests

      - name: Download JUnit Platform Console Standalone
        run: |
          mkdir -p ~/.local/share/neotest-java
          curl -sL https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar \
            -o ~/.local/share/neotest-java/junit-platform-console-standalone.jar

      - name: Validate Neotest Java Configuration
        run: |
          nvim --headless \
            -c "lua vim.env.JDTLS_JAVA_TOOLS='false'; vim.env.NEOTEST_JAVA_CONSOLE_JAR='${HOME}/.local/share/neotest-java/junit-platform-console-standalone.jar'" \
            -c "lua require('ftplugin.java').java_test_check()" \
            -c "qa!" 2>&1 || true

      - name: Test Neotest Keymaps Available
        run: |
          nvim --headless \
            -c "set ft=java" \
            -c "redir! > /tmp/neotest_keymaps.txt" \
            -c "map <leader>j" \
            -c "redir END" \
            -c "qa!" 2>&1
          grep -q "jf" /tmp/neotest_keymaps.txt && echo "✓ <leader>jf keymap found" || (echo "✗ <leader>jf keymap NOT found" && exit 1)
          grep -q "jt" /tmp/neotest_keymaps.txt && echo "✓ <leader>jt keymap found" || (echo "✗ <leader>jt keymap NOT found" && exit 1)
